name = "findco"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

# Deploy: Cloudflare Pages (Git integration or `npx wrangler pages deploy dist`)
# Build command: npm run build   Output directory: dist
# Set in Cloudflare Dashboard -> Pages -> findco -> Settings -> Environment variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_RAZORPAY_KEY_ID  (public, build-time)
#   RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, SUPABASE_SERVICE_ROLE_KEY (secrets, server-only — NEVER prefix secrets with VITE_)
